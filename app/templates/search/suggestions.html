{% if suggestions %}
<div class="absolute z-10 bg-white border border-gray-200 rounded-xl shadow-lg w-full mt-1">
  {% for s in suggestions %}
  <a href="/labs?q={{ s }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600">{{ s }}</a>
  {% endfor %}
</div>
{% endif %}
